name: mingw builder image

# Builds and publishes ghcr.io/jakubkarwacki/proxmark3-mingw-builder --
# the prebuilt Arch/AUR/mingw-w64 toolchain image consumed by
# mingw-cross.yml (this repo) and pm3-connector's release.yml, so those
# jobs don't rebuild the ~30-45min AUR chain (bzip2/lz4/readline/
# python-embed/GD chain) on every run. See docs/specs/mingw-cross-build.md
# and .github/docker/Dockerfile.

on:
  push:
    paths:
      - '.github/docker/Dockerfile'
      - '.github/docker/mingw-toolchain-setup.sh'
      - '.github/workflows/mingw-builder-image.yml'
  workflow_dispatch:

concurrency:
  group: mingw-builder-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build + push mingw-builder image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .github/docker
          push: true
          tags: |
            ghcr.io/jakubkarwacki/proxmark3-mingw-builder:latest
            ghcr.io/jakubkarwacki/proxmark3-mingw-builder:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/jakubkarwacki/proxmark3-mingw-builder:buildcache
          cache-to: type=registry,ref=ghcr.io/jakubkarwacki/proxmark3-mingw-builder:buildcache,mode=max

      # Package stays PRIVATE (it's tied to this repo's own token by
      # default -- no need to publish it world-readable just so a sibling
      # private repo, same account, can pull it). Instead: one-time manual
      # step -- link JakubKarwacki/pm3-connector as an authorized consumer
      # via GitHub's "Manage Actions access" on the package (repo Packages
      # tab -> proxmark3-mingw-builder -> Package settings -> Manage Actions
      # access -> Add repository -> JakubKarwacki/pm3-connector). That grants
      # pm3-connector's OWN GITHUB_TOKEN pull access with zero PAT and zero
      # public exposure; pm3-connector's release.yml already logs in with
      # its own GITHUB_TOKEN before pulling (see that repo's
      # .github/workflows/release.yml, build-pm3-client job).
