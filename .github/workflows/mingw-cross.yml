name: mingw cross-build (client)

# T11, docs/specs/mingw-cross-build.md (R6). Cross-compiles client/proxmark3.exe
# for x86_64-w64-mingw32 from a Linux GH-hosted runner, without a Windows host.
#
# Runner stays ubuntu-latest (GH-hosted, no self-hosted infra to maintain) --
# the actual mingw-w64/AUR toolchain runs inside the prebuilt
# ghcr.io/jakubkarwacki/proxmark3-mingw-builder image (built once by
# mingw-builder-image.yml, not rebuilt per-run: the AUR chain --
# mingw-w64-bzip2/lz4/readline/python312-bin, and the
# zlib/libpng/freetype2-bootstrap/libjpeg-turbo/gd chain -- takes
# ~30-45min from scratch, see docs/specs/mingw-cross-build.md). This job
# just pulls that image and runs `make`. The produced client/proxmark3.exe
# is a plain PE32+ file on the bind-mounted workspace, so the Wine smoke
# test (R3) runs natively on the ubuntu-latest host afterwards -- no
# Wine-inside-container complexity needed.

on:
  push:
    paths:
      - 'client/Makefile'
      - 'Makefile.defs'
      - 'client/deps/liblua/**'
      - 'client/deps/jansson/**'
      - '.github/scripts/mingw-cross-build.sh'
      - '.github/workflows/mingw-cross.yml'
  pull_request:
    paths:
      - 'client/Makefile'
      - 'Makefile.defs'
      - 'client/deps/liblua/**'
      - 'client/deps/jansson/**'
      - '.github/scripts/mingw-cross-build.sh'
      - '.github/workflows/mingw-cross.yml'
  workflow_dispatch:

concurrency:
  group: mingw-cross-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw-cross-build:
    name: Cross-build client (mingw-w64, prebuilt Arch/AUR image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # to pull ghcr.io/jakubkarwacki/proxmark3-mingw-builder
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ccache persisted across runs: `make clean` (inside the build
      # script) always wipes obj/, but ccache caches at the
      # compilation-unit level so a rebuild of an unchanged tree is a
      # cache hit rather than a ~150-file recompile.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ci-cache/ccache
          key: mingw-cross-ccache-${{ github.sha }}
          restore-keys: mingw-cross-ccache-

      - name: Prepare ccache dir
        run: mkdir -p "${{ github.workspace }}/.ci-cache/ccache"

      - name: Build client (prebuilt mingw-w64 toolchain image)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -v "${{ github.workspace }}/.ci-cache/ccache:/ccache" \
            -e CCACHE_DIR=/ccache \
            ghcr.io/jakubkarwacki/proxmark3-mingw-builder:latest \
            bash /repo/.github/scripts/mingw-cross-build.sh

      - name: Verify PE32+ output
        run: file client/proxmark3.exe | grep -q 'PE32+' || (echo "::error::client/proxmark3.exe is not a PE32+ binary" && exit 1)

      - name: Verify DLL import table (R7 -- no unexpected external DLLs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mingw-w64-tools
          x86_64-w64-mingw32-objdump -p client/proxmark3.exe | grep 'DLL Name' | tee /tmp/imports.txt
          # Anything beyond system Windows DLLs, api-ms-win-crt-*, libgd.dll
          # and python312.dll (the two documented no-static-variant
          # exceptions, see docs/specs/mingw-cross-build.md T7/T8) is a
          # regression.
          if grep -viE 'DLL Name: (ADVAPI32|KERNEL32|USER32|WS2_32|api-ms-win-crt-|libgd\.dll|python312\.dll)' /tmp/imports.txt; then
            echo "::error::unexpected external DLL dependency in proxmark3.exe (R7 regression)"
            exit 1
          fi

      - name: Wine smoke test (R3/T10)
        run: |
          sudo apt-get install -y --no-install-recommends wine
          cd client
          wine proxmark3.exe --help
