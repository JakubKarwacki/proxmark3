name: mingw cross-build (client)

# T11, docs/specs/mingw-cross-build.md (R6). Cross-compiles client/proxmark3.exe
# for x86_64-w64-mingw32 without a Windows host, and without Docker: the
# mingw-w64/AUR toolchain (bzip2/lz4/readline/python312-bin, and the
# zlib/brotli/libpng/freetype2-bootstrap/libjpeg-turbo/gd/openssl chain) is
# provisioned directly on this self-hosted runner host by
# .github/scripts/mingw-toolchain-setup.sh (see
# .github/workflows/mingw-toolchain-setup.yml) -- this job just runs `make`
# against it. Runs on a self-hosted runner (this machine, label `bh-local`,
# see ~/actions-runners/proxmark3) -- decision made mid-session to keep CI
# fully local, zero GitHub Actions minutes. The produced client/proxmark3.exe
# is a plain PE32+ file, so the Wine smoke test (R3) runs directly on the
# host afterwards (mingw-w64-tools/wine already installed there).

on:
  push:
    paths:
      - 'client/Makefile'
      - 'Makefile.defs'
      - 'client/deps/liblua/**'
      - 'client/deps/jansson/**'
      - '.github/scripts/mingw-cross-build.sh'
      - '.github/workflows/mingw-cross.yml'
  pull_request:
    paths:
      - 'client/Makefile'
      - 'Makefile.defs'
      - 'client/deps/liblua/**'
      - 'client/deps/jansson/**'
      - '.github/scripts/mingw-cross-build.sh'
      - '.github/workflows/mingw-cross.yml'
  workflow_dispatch:

concurrency:
  group: mingw-cross-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw-cross-build:
    name: Cross-build client (mingw-w64, host toolchain)
    runs-on: [self-hosted, bh-local]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build client
        run: bash .github/scripts/mingw-cross-build.sh

      - name: Verify PE32+ output
        run: file client/proxmark3.exe | grep -q 'PE32+' || (echo "::error::client/proxmark3.exe is not a PE32+ binary" && exit 1)

      - name: Verify DLL import table (R7 -- no unexpected external DLLs)
        run: |
          x86_64-w64-mingw32-objdump -p client/proxmark3.exe | grep 'DLL Name' | tee /tmp/imports.txt
          # Anything beyond system Windows DLLs, api-ms-win-crt-*, libgd.dll
          # and python312.dll (the two documented no-static-variant
          # exceptions, see docs/specs/mingw-cross-build.md T7/T8) is a
          # regression.
          if grep -viE 'DLL Name: (ADVAPI32|KERNEL32|USER32|WS2_32|api-ms-win-crt-|libgd\.dll|python312\.dll)' /tmp/imports.txt; then
            echo "::error::unexpected external DLL dependency in proxmark3.exe (R7 regression)"
            exit 1
          fi

      - name: Wine smoke test (R3/T10)
        run: |
          cd client
          wine proxmark3.exe --help
