name: mingw toolchain setup (host)

# Provisions the mingw-w64/AUR cross-compile toolchain directly on the
# self-hosted runner host (Arch Linux, label bh-local) -- no Docker, no
# registry. See .github/scripts/mingw-toolchain-setup.sh and
# docs/specs/mingw-cross-build.md.
# Runs ONLY manually via workflow_dispatch (e.g. initial setup or host rebuild),
# to prevent automated CI failures due to password-protected sudo.

on:
  workflow_dispatch:

concurrency:
  group: mingw-toolchain-setup
  cancel-in-progress: false

jobs:
  provision:
    name: Provision mingw-w64/AUR toolchain
    runs-on: [self-hosted, bh-local]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run toolchain setup
        run: bash .github/scripts/mingw-toolchain-setup.sh
