name: Public Fork Leak Guard

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: leak-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leak-check:
    name: Verify No Leaked Secrets or Local Agentic Infra
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if agentic-infra directories or session logs exist in tracked files
        run: |
          echo "Checking for leaked local agentic-infra directories and session logs..."
          LEAKED_INFRA=$(git ls-tree -r --name-only HEAD | grep -E '(^|/)(\.agents|\.claude|\.local|\.omp|\.gemini)(/|$)|.*\.session\.jsonl$' || true)
          if [ -n "$LEAKED_INFRA" ]; then
            echo "::error::Tracked agentic infrastructure or session logs found in git repository:"
            echo "$LEAKED_INFRA"
            echo "These must remain strictly local. Add to .gitignore and remove from git history."
            exit 1
          fi

      - name: Fail if sensitive files (.env, keys, certs) are tracked in git
        run: |
          echo "Checking for sensitive credential files..."
          LEAKED_FILES=$(git ls-tree -r --name-only HEAD | grep -v '^client/resources/' | grep -E '(^|/)(\.env|\.env\..*|.*\.pem|.*\.key|.*\.pfx|id_rsa.*|id_ed25519.*)$' || true)
          if [ -n "$LEAKED_FILES" ]; then
            echo "::error::Tracked sensitive key/environment files found in git:"
            echo "$LEAKED_FILES"
            exit 1
          fi

      - name: Check for private network IPs or leaked internal tokens
        run: |
          echo "Checking for private IP leaks (192.168.100.x)..."
          if git grep -E '192\.168\.100\.[0-9]+' HEAD -- ':!docs/specs/mingw-cross-build.md' 2>/dev/null; then
            echo "::error::Private internal LAN IPs found in tracked files."
            exit 1
          fi

      - name: Warn if uncommitted local-only directories exist on runner host
        run: |
          if [ -d .agents ] || [ -d .claude ] || [ -d .local ] || [ -d .omp ]; then
            echo "INFO: Local agentic directories exist (good — they are gitignored and not tracked)"
          fi
